if(isP){$('opName').textContent='MOTSTANDER · AI'+(p.hand&&p.button===1?' · D':'');cards('opCards',p.hole[1].length?(p.show?p.hole[1]:['back','back']):[null,null]);cards('myCards',p.hole[0].length?p.hole[0]:[null,null]);cards('board',[...p.board,...Array(5-p.board.length).fill(null)]);$('opTag').textContent=p.show&&p.board.length>=3?names[best([...p.hole[1],...p.board])[0]]:p.active?'Skjulte kort':'AI';$('myTag').textContent=p.board.length>=3?names[best([...p.hole[0],...p.board])[0]]:p.hole[0].length?(p.hole[0][0].v===p.hole[0][1].v?'Par':'Starthånd'):'Dine kort';$('potLabel').textContent=p.active?'POTT · '+['PREFLOP','FLOP','TURN','RIVER'][p.street]:'POTT';$('pot').textContent=fmt(p.active?p.pot:p.lastPot||0);if(!p.active&&p.lastPot)$('potLabel').textContent='SISTE POTT';$('rules').textContent='Heads-up. Blinds 5/10. No-limit: velg innsats selv eller gå all-in. Minste økning følger forrige fulle økning. Overskytende sjetonger returneres. Beste femkortshånd vinner. AI ser ikke dine skjulte kort.';$('actionTitle').textContent=p.active?'Dine valg':'Neste hånd';if(!p.active)action('Ny hånd',pStart,'primary',Math.min(...p.cash)<=0);else if(p.runout){$('actionTitle').textContent='All-in';action('Deler felleskort …',()=>{},'',true)}else if(p.turn===1){$('actionTitle').textContent='Motstanderens tur';action('AI tenker …',()=>{},'',true)}else {let need=toCall(0);action(need?'Syn '+fmt(Math.min(need,p.cash[0])):'Check',()=>playerPoker('call'),'primary');if(canRaise(0)){action((need?'Legg inn ':'Sats ')+fmt(minCommit(0)),()=>playerPoker('raise',$('customStake').valueAsNumber));$('actions').lastElementChild.id='customRaise'}action('All-in · '+fmt(p.cash[0]),()=>playerPoker('allin'),'allin',p.cash[0]<=0||(!canRaise(0)&&p.cash[0]>need));action('Kast kort',()=>playerPoker('fold'),'danger')}}
else{$('opName').textContent='DEALER';cards('opCards',b.dealer.length?(b.show?b.dealer:[b.dealer[0],'back']):[null,null]);cards('myCards',b.player.length?b.player:[null,null]);$('board').innerHTML='';$('opTag').textContent=b.dealer.length?(b.show?'Sum '+bjValue(b.dealer).n:'Synlig '+bjValue([b.dealer[0]]).n):'Dealer står på 17';$('myTag').textContent=b.player.length?'Sum '+bjValue(b.player).n+(bjValue(b.player).soft?' · soft':''):'Dine kort';$('potLabel').textContent='SJETONGER I HÅNDEN';$('pot').textContent=fmt(b.active?(b.split?b.split.reduce((n,h)=>n+h.wager,0):b.wager):b.lastWager||0);if(!b.active&&b.lastWager)$('potLabel').textContent='SISTE HÅND · SJETONGER';$('rules').textContent='Seks kortstokker. Dealer trekker til 17 og står på soft 17. Blackjack gir 3:2; uavgjort gir sjetongene tilbake. Dobling gir ett ekstra kort. Ett splitt per hånd, og ett ekstra kort til hvert splittet ess. Forsikring er ikke inkludert.';$('actionTitle').textContent=b.active?'Dine valg':'Ny hånd';if(!b.active){action('Del ut kort',bStart,'primary',!validBJ(b.stake));$('actions').lastElementChild.id='dealBJ';action('All-in · '+fmt(b.cash),()=>{b.stake=b.cash;bStart()},'allin',b.cash<=0);if(b.cash<=0)$('message').textContent='Ingen flere sjetonger. Nullstill for å spille videre.'}else if(b.resolving){$('actionTitle').textContent='Dealerens tur';action('Dealer trekker …',()=>{},'',true)}else{action('Trekk kort',()=>bHit(),'primary');action('Stå',bStand);action('Doble',()=>bHit(true),'',b.player.length!==2||b.cash+1e-8<b.wager);action('Splitt',bSplit,'',!canSplit())}}}
render();
function openOnline(){if(location.protocol==='file:'){alert('Online krever at du starter serveren i V5-pakken. Åpne deretter nettadressen som vises i terminalen.');return;}location.href='/online';}
